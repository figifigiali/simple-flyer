<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Simple Flyer</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;touch-action:none}
body{background:#75c9ee;font-family:Arial}
canvas{display:block;width:100%;height:100%}

#message{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:26px;
font-weight:bold;
text-align:center;
text-shadow:0 2px 5px #555;
pointer-events:none
}

#speed{
position:fixed;
left:50%;
top:56%;
transform:translate(-50%,-50%);
display:flex;
gap:9px;
pointer-events:auto
}

.speedBtn{
width:48px;
height:48px;
border:2px solid white;
border-radius:50%;
background:rgba(0,0,0,.25);
color:white;
font-size:20px;
font-weight:bold;
text-shadow:0 1px 3px #555
}

.speedBtn.selected{
background:white;
color:#333;
text-shadow:none
}

#speedLabel{
position:fixed;
left:50%;
top:51%;
transform:translate(-50%,-50%);
color:white;
font-size:16px;
font-weight:bold;
text-shadow:0 2px 4px #555;
pointer-events:none
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="message">VÆLG HASTIGHED</div>

<div id="speedLabel">HASTIGHED</div>

<div id="speed">
<button class="speedBtn" data-speed="1">1</button>
<button class="speedBtn" data-speed="2">2</button>
<button class="speedBtn selected" data-speed="3">3</button>
<button class="speedBtn" data-speed="4">4</button>
<button class="speedBtn" data-speed="5">5</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const message=document.getElementById("message");
const speedBox=document.getElementById("speed");
const speedLabel=document.getElementById("speedLabel");

const buttons=document.querySelectorAll(".speedBtn");

let W,H;
let bird;
let pipes=[];
let score=0;
let playing=false;
let lastTime=0;
let pipeTimer=0;
let speedLevel=3;


/* HASTIGHED */

const speedValues={
1:130,
2:165,
3:200,
4:235,
5:270
};


/* MELLEMRUM MELLEM STOLPER */

const gapValues={
1:260,
2:240,
3:220,
4:200,
5:180
};


function resize(){

W=window.innerWidth;
H=window.innerHeight;

canvas.width=W;
canvas.height=H;

}

window.addEventListener("resize",resize);

resize();


/* VÆLG HASTIGHED */

function selectSpeed(level){

speedLevel=level;

buttons.forEach(button=>{

button.classList.toggle(
"selected",
Number(button.dataset.speed)===level
);

});

}


buttons.forEach(button=>{

button.addEventListener("pointerdown",function(e){

e.preventDefault();
e.stopPropagation();

selectSpeed(
Number(button.dataset.speed)
);

});

});


/* START SPIL */

function startGame(){

bird={
x:W*0.23,
y:H*0.45,
velocity:0
};

pipes=[];

score=0;

pipeTimer=0;

playing=true;

message.style.display="none";

speedBox.style.display="none";

speedLabel.style.display="none";

}


/* HOP */

function flap(){

if(!playing){

startGame();

}

/* LIDT HØJERE HOP */

bird.velocity=-450;

}


/* TOUCH */

window.addEventListener("pointerdown",function(e){

if(e.target.classList.contains("speedBtn")){

return;

}

e.preventDefault();

flap();

},{passive:false});


window.addEventListener("touchstart",function(e){

if(e.target.classList.contains("speedBtn")){

return;

}

e.preventDefault();

flap();

},{passive:false});


/* COMPUTER */

window.addEventListener("keydown",function(e){

if(e.code==="Space"){

e.preventDefault();

flap();

}

});


/* LAV STOLPE */

function addPipe(){

const gap=gapValues[speedLevel];

const min=70;

const max=H-70-gap;

const top=
min+
Math.random()*
Math.max(1,max-min);


pipes.push({

x:W+20,

width:60,

top:top,

gap:gap,

passed:false

});

}


/* GAME OVER */

function endGame(){

playing=false;

message.innerHTML=
"GAME OVER<br><span style='font-size:17px'>TRYK FOR AT PRØVE IGEN</span>";

message.style.display="flex";

speedBox.style.display="flex";

speedLabel.style.display="block";

}


/* OPDATER SPIL */

function update(dt){

if(!playing){

return;

}


/* TYNGDEKRAFT */

bird.velocity+=1100*dt;

bird.y+=bird.velocity*dt;


pipeTimer+=dt;


if(pipeTimer>1.5){

pipeTimer=0;

addPipe();

}


/* VALGT HASTIGHED */

const pipeSpeed=
speedValues[speedLevel];


for(let p of pipes){

p.x-=pipeSpeed*dt;


/* SCORE */

if(
!p.passed &&
p.x+p.width<bird.x
){

p.passed=true;

score++;

}


/* KOLLISION */

if(

bird.x+17>p.x &&

bird.x-17<p.x+p.width &&

(

bird.y-17<p.top ||

bird.y+17>p.top+p.gap

)

){

endGame();

}

}


/* FJERN GAMLE STOLPER */

pipes=
pipes.filter(
p=>p.x+p.width>0
);


/* RAMMER TOP/BUND */

if(

bird.y-17<0 ||

bird.y+17>H-35

){

endGame();

}

}


/* TEGN SPIL */

function draw(){

/* HIMMEL */

let sky=
ctx.createLinearGradient(
0,
0,
0,
H
);

sky.addColorStop(
0,
"#70c8ee"
);

sky.addColorStop(
1,
"#e5f8ff"
);

ctx.fillStyle=sky;

ctx.fillRect(
0,
0,
W,
H
);


/* STOLPER */

for(let p of pipes){

ctx.fillStyle="#45a844";


/* ØVERSTE */

ctx.fillRect(
p.x,
0,
p.width,
p.top
);


/* NEDERSTE */

ctx.fillRect(
p.x,
p.top+p.gap,
p.width,
H-(p.top+p.gap)-35
);

}


/* JORD */

ctx.fillStyle="#65b34a";

ctx.fillRect(
0,
H-35,
W,
35
);


/* GUL FIGUR */

ctx.fillStyle="#ffd23f";

ctx.beginPath();

ctx.arc(
bird.x,
bird.y,
17,
0,
Math.PI*2
);

ctx.fill();


/* ØJE */

ctx.fillStyle="#222";

ctx.beginPath();

ctx.arc(
bird.x+6,
bird.y-6,
3,
0,
Math.PI*2
);

ctx.fill();


/* SCORE */

ctx.fillStyle="white";

ctx.font=
"bold 34px Arial";

ctx.textAlign="center";

ctx.fillText(
score,
W/2,
55
);

}


/* GAME LOOP */

function loop(time){

let dt=
(time-lastTime)/1000;


if(dt>0.035){

dt=0.035;

}


lastTime=time;

update(dt);

draw();

requestAnimationFrame(loop);

}


/* START */

bird={
x:W*.23,
y:H*.45,
velocity:0
};

requestAnimationFrame(loop);

</script>

</body>
</html>
