<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Crazy Flyer</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
touch-action:none
}

body{
background:#39a9e8;
font-family:Arial,sans-serif
}

canvas{
display:block;
width:100%;
height:100%
}

#message{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:26px;
font-weight:bold;
text-align:center;
text-shadow:0 3px 5px #555;
pointer-events:none
}

#speed{
position:fixed;
left:50%;
top:56%;
transform:translate(-50%,-50%);
display:flex;
gap:9px;
pointer-events:auto
}

.speedBtn{
width:48px;
height:48px;
border:2px solid white;
border-radius:50%;
background:rgba(0,0,0,.25);
color:white;
font-size:20px;
font-weight:bold;
text-shadow:0 1px 3px #555
}

.speedBtn.selected{
background:white;
color:#222;
text-shadow:none
}

#speedLabel{
position:fixed;
left:50%;
top:51%;
transform:translate(-50%,-50%);
color:white;
font-size:16px;
font-weight:bold;
text-shadow:0 2px 4px #555;
pointer-events:none
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="message">VÆLG HASTIGHED</div>
<div id="speedLabel">HASTIGHED</div>

<div id="speed">
<button class="speedBtn" data-speed="1">1</button>
<button class="speedBtn" data-speed="2">2</button>
<button class="speedBtn selected" data-speed="3">3</button>
<button class="speedBtn" data-speed="4">4</button>
<button class="speedBtn" data-speed="5">5</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const message=document.getElementById("message");
const speedBox=document.getElementById("speed");
const speedLabel=document.getElementById("speedLabel");
const buttons=document.querySelectorAll(".speedBtn");

let W,H;
let bird;

let pipes=[];
let balls=[];

let score=0;
let playing=false;

let lastTime=0;
let pipeTimer=0;
let pipeCount=0;

let speedLevel=3;


/* HASTIGHEDER */

const speedValues={
1:130,
2:165,
3:200,
4:235,
5:270
};


/* MELLEMRUM MELLEM STOLPER */

const gapValues={
1:260,
2:240,
3:220,
4:200,
5:180
};


/* SKÆRM */

function resize(){

W=window.innerWidth;
H=window.innerHeight;

canvas.width=W;
canvas.height=H;

}

window.addEventListener("resize",resize);

resize();


/* HASTIGHED */

function selectSpeed(level){

speedLevel=level;

buttons.forEach(button=>{

button.classList.toggle(
"selected",
Number(button.dataset.speed)===level
);

});

}


buttons.forEach(button=>{

button.addEventListener("pointerdown",function(e){

e.preventDefault();
e.stopPropagation();

selectSpeed(
Number(button.dataset.speed)
);

});

});


/* START */

function startGame(){

bird={
x:W*0.23,
y:H*0.45,
velocity:0
};

pipes=[];
balls=[];

score=0;

pipeTimer=0;
pipeCount=0;

playing=true;

message.style.display="none";
speedBox.style.display="none";
speedLabel.style.display="none";

}


/* HOP */

function flap(){

if(!playing){

startGame();

}

bird.velocity=-450;

}


/* TOUCH */

window.addEventListener("pointerdown",function(e){

if(e.target.classList.contains("speedBtn")){

return;

}

e.preventDefault();

flap();

},{passive:false});


window.addEventListener("touchstart",function(e){

if(e.target.classList.contains("speedBtn")){

return;

}

e.preventDefault();

flap();

},{passive:false});


/* TASTATUR */

window.addEventListener("keydown",function(e){

if(e.code==="Space"){

e.preventDefault();

flap();

}

});


/* NY STOLPE */

function addPipe(){

const gap=gapValues[speedLevel];

const min=70;
const max=H-70-gap;

const top=
min+
Math.random()*(max-min);

const pipe={

x:W+20,
width:60,
top:top,
gap:gap,
passed:false

};

pipes.push(pipe);

pipeCount++;


/*
================================================
RØD BOLD
NIVEAU 3, 4 OG 5
HVER ANDEN STOLPE
================================================
*/

if(

(speedLevel===3 ||
speedLevel===4 ||
speedLevel===5)

&&

pipeCount%2===0

){

balls.push({

type:"red",

x:W*0.50,

y:-20,

radius:14

});

}


/*
================================================
TENNISBOLD
NIVEAU 3, 4 OG 5
HVER ANDEN STOLPE
================================================
*/

if(

(speedLevel===3 ||
speedLevel===4 ||
speedLevel===5)

&&

pipeCount%2===0

){

balls.push({

type:"tennis",

x:W*0.70,

y:-100,

radius:13

});

}

}


/* GAME OVER */

function endGame(){

playing=false;

message.innerHTML=
"GAME OVER<br><span style='font-size:17px'>TRYK FOR AT PRØVE IGEN</span>";

message.style.display="flex";

speedBox.style.display="flex";
speedLabel.style.display="block";

}


/* OPDATERING */

function update(dt){

if(!playing){

return;

}


/* FUGL */

bird.velocity+=1100*dt;

bird.y+=bird.velocity*dt;


/* NY STOLPE */

pipeTimer+=dt;

let pipeInterval=1.5;

if(speedLevel===4){

pipeInterval=1.25;

}

if(speedLevel===5){

pipeInterval=1.05;

}

if(pipeTimer>pipeInterval){

pipeTimer=0;

addPipe();

}


const pipeSpeed=
speedValues[speedLevel];


/* STOLPER */

for(let p of pipes){

p.x-=pipeSpeed*dt;


/* SCORE */

if(
!p.passed &&
p.x+p.width<bird.x
){

p.passed=true;

score++;

}


/* KOLLISION MED STOLPE */

if(

bird.x+17>p.x &&

bird.x-17<p.x+p.width &&

(

bird.y-17<p.top ||

bird.y+17>p.top+p.gap

)

){

endGame();

}

}


/* =================================
   RØDE BOLDE OG TENNISBOLDE
================================= */

for(let ball of balls){

/*
Alle bolde falder lodret.
*/

ball.y+=320*dt;


/* KOLLISION */

const dx=bird.x-ball.x;
const dy=bird.y-ball.y;

const distance=
Math.sqrt(
dx*dx+
dy*dy
);

if(
distance<
17+ball.radius
){

endGame();

}

}


/* FJERN GAMLE STOLPER */

pipes=pipes.filter(
p=>p.x+p.width>0
);


/* FJERN GAMLE BOLDE */

balls=balls.filter(
ball=>ball.y-ball.radius<H
);


/* TOP / BUND */

if(

bird.y-17<0 ||

bird.y+17>H-35

){

endGame();

}

}


/* AFRUNDET REKTANGEL */

function roundedRect(
x,y,w,h,r
){

ctx.beginPath();

ctx.roundRect(
x,y,w,h,r
);

}


/* SKYER */

function drawCloud(x,y,size){

ctx.fillStyle="rgba(255,255,255,.75)";

ctx.beginPath();

ctx.arc(
x,
y,
size*.55,
0,
Math.PI*2
);

ctx.arc(
x+size*.55,
y-size*.15,
size*.7,
0,
Math.PI*2
);

ctx.arc(
x+size*1.15,
y,
size*.5,
0,
Math.PI*2
);

ctx.fill();

}


/* BY */

function drawCity(){

ctx.fillStyle="rgba(80,170,210,.30)";

const buildings=[

[0,.86,.07,.14],
[.07,.82,.09,.18],
[.16,.88,.06,.12],
[.22,.80,.10,.20],
[.32,.85,.07,.15],
[.39,.78,.09,.22],
[.48,.86,.06,.14],
[.54,.81,.10,.19],
[.64,.86,.07,.14],
[.71,.79,.09,.21],
[.80,.84,.07,.16],
[.87,.76,.10,.24],
[.97,.84,.06,.16]

];

for(let b of buildings){

ctx.fillRect(
b[0]*W,
b[1]*H,
b[2]*W,
b[3]*H
);

}

}


/* BUSKE */

function drawBushes(){

ctx.fillStyle="#48b84f";

for(let x=0;x<W;x+=35){

ctx.beginPath();

ctx.arc(
x,
H-38,
28,
Math.PI,
0
);

ctx.fill();

}

}


/* STOLPER */

function drawPipe(p){

const capHeight=20;
const capExtra=8;

ctx.fillStyle="#45a844";


/* ØVERSTE STOLPE */

ctx.fillRect(
p.x,
0,
p.width,
p.top
);


/* ØVERSTE HÆTTE */

roundedRect(
p.x-capExtra,
p.top-capHeight,
p.width+capExtra*2,
capHeight,
10
);

ctx.fill();


/* NEDERSTE STOLPE */

ctx.fillRect(
p.x,
p.top+p.gap,
p.width,
H-(p.top+p.gap)-45
);


/* NEDERSTE HÆTTE */

roundedRect(
p.x-capExtra,
p.top+p.gap,
p.width+capExtra*2,
capHeight,
10
);

ctx.fill();

}


/* CRAZY EMOJI */

function drawBird(){

const x=bird.x;
const y=bird.y;
const r=17;


/* HOVED */

ctx.fillStyle="#ffd21f";

ctx.beginPath();

ctx.arc(
x,y,r,
0,
Math.PI*2
);

ctx.fill();


/* ØJNE */

ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(
x-6,y-5,
6,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
x+6,y-3,
6,
0,
Math.PI*2
);

ctx.fill();


/* PUPILLER */

ctx.fillStyle="#111";

ctx.beginPath();

ctx.arc(
x-5,y-5,
2.7,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
x+7,y-2,
2.7,
0,
Math.PI*2
);

ctx.fill();


/* MUND */

ctx.fillStyle="#111";

ctx.beginPath();

ctx.ellipse(
x+1,y+7,
8,5,
0,
0,
Math.PI*2
);

ctx.fill();


/* TUNGE */

ctx.fillStyle="#f04455";

ctx.beginPath();

ctx.ellipse(
x+2,y+11,
4,6,
0,
0,
Math.PI*2
);

ctx.fill();


/* ØJENBRYN */

ctx.strokeStyle="#111";
ctx.lineWidth=2.5;

ctx.beginPath();

ctx.moveTo(
x-12,y-13
);

ctx.lineTo(
x-5,y-15
);

ctx.stroke();


ctx.beginPath();

ctx.moveTo(
x+4,y-14
);

ctx.lineTo(
x+12,y-10
);

ctx.stroke();

}


/* RØD BOLD */

function drawRedBall(ball){

ctx.fillStyle="#e53935";

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
ball.radius,
0,
Math.PI*2
);

ctx.fill();

}


/* TENNISBOLD */

function drawTennisBall(ball){

/* Gul/grøn tennisbold */

ctx.fillStyle="#c8e82b";

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
ball.radius,
0,
Math.PI*2
);

ctx.fill();


/* HVIDE TENNISLINJER */

ctx.strokeStyle="white";

ctx.lineWidth=2;

ctx.beginPath();

ctx.arc(
ball.x-5,
ball.y,
ball.radius*.75,
-Math.PI/2,
Math.PI/2
);

ctx.stroke();


ctx.beginPath();

ctx.arc(
ball.x+5,
ball.y,
ball.radius*.75,
Math.PI/2,
-Math.PI/2
);

ctx.stroke();

}


/* TEGN SPILLET */

function draw(){

/* HIMMEL */

let sky=
ctx.createLinearGradient(
0,0,0,H
);

sky.addColorStop(
0,
"#31a9e8"
);

sky.addColorStop(
0.65,
"#74d0f2"
);

sky.addColorStop(
1,
"#d8f5ff"
);

ctx.fillStyle=sky;

ctx.fillRect(
0,0,W,H
);


/* SKYER */

drawCloud(
W*.08,
H*.27,
45
);

drawCloud(
W*.78,
H*.34,
55
);

drawCloud(
W*.42,
H*.70,
70
);


/* BY */

drawCity();


/* STOLPER */

for(let p of pipes){

drawPipe(p);

}


/* BOLDE */

for(let ball of balls){

if(ball.type==="red"){

drawRedBall(ball);

}

if(ball.type==="tennis"){

drawTennisBall(ball);

}

}


/* BUSKE */

drawBushes();


/* JORD */

ctx.fillStyle="#65b34a";

ctx.fillRect(
0,
H-35,
W,
35
);


/* GRÆSKANT */

ctx.fillStyle="#3d963c";

ctx.fillRect(
0,
H-38,
W,
4
);


/* EMOJI */

drawBird();


/* SCORE */

ctx.fillStyle="white";

ctx.font="bold 34px Arial";

ctx.textAlign="center";

ctx.shadowColor="rgba(0,0,0,.35)";
ctx.shadowBlur=4;
ctx.shadowOffsetY=2;

ctx.fillText(
score,
W/2,
55
);

ctx.shadowBlur=0;
ctx.shadowOffsetY=0;

}


/* GAME LOOP */

function loop(time){

let dt=
(time-lastTime)/1000;

if(dt>0.035){

dt=0.035;

}

lastTime=time;

update(dt);

draw();

requestAnimationFrame(loop);

}


/* START */

bird={

x:W*.23,
y:H*.45,
velocity:0

};

requestAnimationFrame(loop);

</script>

</body>
</html>
