<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Simple Flyer</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
touch-action:none
}

body{
background:#75c9ee;
font-family:Arial
}

canvas{
display:block;
width:100%;
height:100%
}

#message{
position:fixed;
inset:0;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:26px;
font-weight:bold;
text-align:center;
text-shadow:0 2px 5px #555;
pointer-events:none
}

#speed{
position:fixed;
left:50%;
top:56%;
transform:translate(-50%,-50%);
display:flex;
gap:9px;
pointer-events:auto
}

.speedBtn{
width:48px;
height:48px;
border:2px solid white;
border-radius:50%;
background:rgba(0,0,0,.25);
color:white;
font-size:20px;
font-weight:bold;
text-shadow:0 1px 3px #555
}

.speedBtn.selected{
background:white;
color:#333;
text-shadow:none
}

#speedLabel{
position:fixed;
left:50%;
top:51%;
transform:translate(-50%,-50%);
color:white;
font-size:16px;
font-weight:bold;
text-shadow:0 2px 4px #555;
pointer-events:none
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="message">VÆLG HASTIGHED</div>

<div id="speedLabel">HASTIGHED</div>

<div id="speed">
<button class="speedBtn" data-speed="1">1</button>
<button class="speedBtn" data-speed="2">2</button>
<button class="speedBtn selected" data-speed="3">3</button>
<button class="speedBtn" data-speed="4">4</button>
<button class="speedBtn" data-speed="5">5</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const message=document.getElementById("message");
const speedBox=document.getElementById("speed");
const speedLabel=document.getElementById("speedLabel");

const buttons=document.querySelectorAll(".speedBtn");

let W,H;
let bird;
let pipes=[];
let balls=[];

let score=0;
let playing=false;
let lastTime=0;
let pipeTimer=0;
let pipeCount=0;

let speedLevel=3;


/* HASTIGHEDERNE ER UÆNDRET */

const speedValues={
1:130,
2:165,
3:200,
4:235,
5:270
};


function resize(){

W=window.innerWidth;
H=window.innerHeight;

canvas.width=W;
canvas.height=H;

}

window.addEventListener("resize",resize);

resize();


function selectSpeed(level){

speedLevel=level;

buttons.forEach(button=>{

button.classList.toggle(
"selected",
Number(button.dataset.speed)===level
);

});

}


buttons.forEach(button=>{

button.addEventListener("pointerdown",function(e){

e.preventDefault();
e.stopPropagation();

selectSpeed(
Number(button.dataset.speed)
);

});

});


function startGame(){

bird={
x:W*0.23,
y:H*0.45,
velocity:0
};

pipes=[];

balls=[];

score=0;

pipeTimer=0;

pipeCount=0;

playing=true;

message.style.display="none";

speedBox.style.display="none";
speedLabel.style.display="none";

}


function flap(){

if(!playing){

startGame();

}

bird.velocity=-420;

}


window.addEventListener("pointerdown",function(e){

if(e.target.classList.contains("speedBtn")){

return;

}

e.preventDefault();

flap();

},{passive:false});


window.addEventListener("touchstart",function(e){

if(e.target.classList.contains("speedBtn")){

return;

}

e.preventDefault();

flap();

},{passive:false});


window.addEventListener("keydown",function(e){

if(e.code==="Space"){

e.preventDefault();

flap();

}

});


/*
MELLEMRUM MELLEM STOLPERNE

1 = 260
2 = 240
3 = 220
4 = 200
5 = 180
*/

function addPipe(){

const gapValues={
1:260,
2:240,
3:220,
4:200,
5:180
};

const gap=gapValues[speedLevel];

const min=70;

const max=H-70-gap;

const top=min+Math.random()*(max-min);

const pipe={
x:W+20,
width:60,
top:top,
gap:gap,
passed:false
};

pipes.push(pipe);

pipeCount++;


/*
BOLD PÅ HVER ANDEN STOLPE
KUN PÅ NIVEAU 4 OG 5
*/

if(
(speedLevel===4 || speedLevel===5) &&
pipeCount%2===0
){

balls.push({

x:pipe.x+pipe.width/2,

y:-25,

radius:14

});

}

}


function endGame(){

playing=false;

message.innerHTML=
"GAME OVER<br><span style='font-size:17px'>TRYK FOR AT PRØVE IGEN</span>";

message.style.display="flex";

speedBox.style.display="flex";
speedLabel.style.display="block";

}


function update(dt){

if(!playing){

return;

}


/* FUGLEN */

bird.velocity+=1100*dt;

bird.y+=bird.velocity*dt;


/* NY STOLPE */

pipeTimer+=dt;

if(pipeTimer>1.5){

pipeTimer=0;

addPipe();

}


const pipeSpeed=speedValues[speedLevel];


/* STOLPER */

for(let p of pipes){

p.x-=pipeSpeed*dt;


if(
!p.passed &&
p.x+p.width<bird.x
){

p.passed=true;

score++;

}


if(

bird.x+17>p.x &&

bird.x-17<p.x+p.width &&

(

bird.y-17<p.top ||

bird.y+17>p.top+p.gap

)

){

endGame();

}

}


/* BOLDE */

for(let ball of balls){

/*
Boldens lodrette hastighed.
På niveau 5 falder den lidt hurtigere.
*/

const ballSpeed=
speedLevel===5 ? 360 : 310;

ball.y+=ballSpeed*dt;


/* KOLLISION MELLEM FUGL OG BOLD */

const dx=bird.x-ball.x;
const dy=bird.y-ball.y;

const distance=Math.sqrt(
dx*dx+dy*dy
);

if(
distance<
bird.r+ball.radius
){

endGame();

}

}


/* FJERN GAMLE STOLPER */

pipes=pipes.filter(
p=>p.x+p.width>0
);


/* FJERN BOLDE DER ER FALDET UD */

balls=balls.filter(
ball=>ball.y-ball.radius<H
);


/* TOP / BUND */

if(

bird.y-17<0 ||

bird.y+17>H-35

){

endGame();

}

}


function draw(){

/* HIMMEL */

let sky=
ctx.createLinearGradient(
0,0,0,H
);

sky.addColorStop(
0,
"#70c8ee"
);

sky.addColorStop(
1,
"#e5f8ff"
);

ctx.fillStyle=sky;

ctx.fillRect(
0,
0,
W,
H
);


/* STOLPER */

for(let p of pipes){

ctx.fillStyle="#45a844";


ctx.fillRect(
p.x,
0,
p.width,
p.top
);


ctx.fillRect(
p.x,
p.top+p.gap,
p.width,
H-(p.top+p.gap)-35
);

}


/* BOLDE */

for(let ball of balls){

ctx.fillStyle="#e53935";

ctx.beginPath();

ctx.arc(
ball.x,
ball.y,
ball.radius,
0,
Math.PI*2
);

ctx.fill();

}


/* JORD */

ctx.fillStyle="#65b34a";

ctx.fillRect(
0,
H-35,
W,
35
);


/* GUL FIGUR */

ctx.fillStyle="#ffd23f";

ctx.beginPath();

ctx.arc(
bird.x,
bird.y,
17,
0,
Math.PI*2
);

ctx.fill();


/* ØJE */

ctx.fillStyle="#222";

ctx.beginPath();

ctx.arc(
bird.x+6,
bird.y-6,
3,
0,
Math.PI*2
);

ctx.fill();


/* SCORE */

ctx.fillStyle="white";

ctx.font="bold 34px Arial";

ctx.textAlign="center";

ctx.fillText(
score,
W/2,
55
);

}


/* GAME LOOP */

function loop(time){

let dt=
(time-lastTime)/1000;

if(dt>0.035){

dt=0.035;

}

lastTime=time;

update(dt);

draw();

requestAnimationFrame(loop);

}


/* START */

bird={
x:W*.23,
y:H*.45,
velocity:0
};

requestAnimationFrame(loop);

</script>

</body>
</html>
